# The dreamkit plugin catalogue. Add yours with a pull request: name, repo, description (and `pip` if the plugin
# lives in a subfolder).
- name: gripper-check
  repo: https://github.com/chlorei/hackathon26/tree/main/plugins-external/gripper-check
  pip: git+https://github.com/chlorei/hackathon26.git#subdirectory=plugins-external/gripper-check
  description: Catches a gripper closed on nothing and a grip that loosens mid-carry
  tags: [gripper, grasp]
- name: reliability
  repo: https://github.com/chlorei/hackathon26/tree/main/plugins-external/reliability
  pip: git+https://github.com/chlorei/hackathon26.git#subdirectory=plugins-external/reliability
  description: Success rate with a confidence interval, cost per success, and a proven A/B comparison between runs
  tags: [statistics, ab-test, reliability]
- name: vision-judge
  repo: https://github.com/chlorei/hackathon26/tree/main/plugins-external/vision-judge
  pip: git+https://github.com/chlorei/hackathon26.git#subdirectory=plugins-external/vision-judge
  description: A vision model judges every attempt from camera frames; success rate by task and top failure reasons across runs
  tags: [vision, judge, statistics]
- name: dreamgym
  kind: app
  title: Data
  repo: https://github.com/chlorei/hackathon26/tree/main/plugins-external/dreamgym
  pip: git+https://github.com/chlorei/hackathon26.git#subdirectory=plugins-external/dreamgym
  description: "Data tab: collect fine-tuning demos (scripted, Dream-1, teleop) live, review, train, compare base vs fine-tune; Arena/Compare on the command line"
  tags: [app, arena, ab-test, datasets, teleop]

[project]
name = "dreamkit"
version = "0.2.0"
description = "Plugin toolkit around the Dream-1 control loop: checks, failure analysis, retries, recording, a web panel."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
    "dreamlabs-client[datasets]>=1.1.7,<2",
    "mujoco>=3.3.5",
    "numpy",
    "pillow>=10",
    "pydantic>=2",
    "pyyaml>=6",
    "rich>=13",
    "av>=17",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx"]

[project.scripts]
dreamkit = "dreamkit.cli:main"

# Built-in plugins register the same way an external plugin does.
[project.entry-points."dreamkit.plugins"]
success-check = "dreamkit.plugins.success_check:SuccessCheck"
failure-monitor = "dreamkit.plugins.failure_monitor:FailureMonitor"
camera-check = "dreamkit.plugins.camera_check:CameraCheck"
retry = "dreamkit.plugins.retry:Retry"
latency-monitor = "dreamkit.plugins.latency_monitor:LatencyMonitor"
recorder = "dreamkit.plugins.recorder:Recorder"
safety = "dreamkit.plugins.safety:Safety"
recap = "dreamkit.plugins.recap:Recap"
harvester = "dreamkit.plugins.harvester:Harvester"
recovery = "dreamkit.plugins.recovery:Recovery"
report = "dreamkit.plugins.report:Report"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dreamkit"]
artifacts = ["dreamkit/ui_dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 119

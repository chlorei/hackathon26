[project]
name = "dreamkit-safety"
version = "0.1.0"
description = "safety: an example modify_actions plugin for dreamkit (joint speed cap, workspace box)"
requires-python = ">=3.11"
dependencies = ["dreamkit>=0.3"]

[project.entry-points."dreamkit.plugins"]
safety = "safety:Safety"

[tool.dreamkit]
api = "1"
group = "safety"
icon = "ShieldCheck"
capability = "modify_actions"
hooks = ["on_episode_start", "after_model", "on_episode_end"]
ui = "ui/index.html"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["safety"]

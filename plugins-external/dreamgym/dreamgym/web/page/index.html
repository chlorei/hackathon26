<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data</title>
<link rel="stylesheet" href="/theme/dreamkit-theme.css">
<style>
:root{
  /* dreamkit's theme (/theme.css): DreamGym's names mapped onto the panel's variables, no colours of its own */
  --bg:var(--dk-base); --panel:var(--dk-panel); --ink:var(--dk-ink); --muted:var(--dk-dim); --line:var(--dk-line);
  --soft:var(--dk-raised); --ok:var(--dk-ok); --ok-soft:var(--dk-ok-soft); --bad:var(--dk-bad); --bad-soft:var(--dk-bad-soft);
  --run:var(--dk-signal); --run-soft:var(--dk-signal-soft); --warn:var(--dk-warn); --radius:12px;
  --c1:var(--dk-cat-1); --c2:var(--dk-cat-2); --c3:var(--dk-cat-3); --c4:var(--dk-cat-4); --c5:var(--dk-cat-5);
  --c6:var(--dk-cat-6); --c7:var(--dk-cat-7); --c8:var(--dk-cat-8);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.5 var(--dk-font-sans);background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:16px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand span{color:var(--muted);font-weight:500;font-size:13px;margin-left:8px}
.spacer{flex:1}
.spend{color:var(--muted);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn:disabled{opacity:.5;cursor:default}
main{flex:1;display:grid;grid-template-columns:330px 1fr;min-height:0}
aside{border-right:1px solid var(--line);overflow:auto;padding:12px;background:var(--bg)}
.run{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
.run:hover{border-color:var(--dk-faint)}
.run.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.run .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.run .task{font-weight:650}
.run .sub{color:var(--muted);font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.run .rates{display:flex;gap:10px;margin-top:6px;font-variant-numeric:tabular-nums;font-size:13px}
.pill{font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:20px;white-space:nowrap}
.pill.running{background:var(--run-soft);color:var(--run)}
.pill.done{background:var(--soft);color:var(--muted)}
.pill.failed,.pill.stopped{background:var(--bad-soft);color:var(--bad)}
.pill.mode{background:var(--soft);color:var(--ink);font-weight:600}
.mini{height:4px;background:var(--soft);border-radius:3px;margin-top:8px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--run)}
section.detail{overflow:auto;padding:24px 28px 60px}
.empty{color:var(--muted);text-align:center;margin-top:18vh}
.empty h2{color:var(--ink);font-size:22px;margin:0 0 8px}
h1{font-size:24px;margin:0;letter-spacing:-.015em}
.headrow{display:flex;align-items:flex-start;gap:16px}
.prompt{color:var(--muted);margin-top:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:2px 8px;font-size:12.5px;color:var(--muted)}
.chip b{color:var(--ink);font-weight:600}
.progress{margin-top:16px;height:8px;background:var(--soft);border-radius:5px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--run);transition:width .4s}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-top:16px}
.card h3{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:650}
.stats{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:16px}
.stat .v{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .v.big{font-size:52px;line-height:1}
.stat .l{color:var(--muted);font-size:12.5px;margin-top:4px}
.rate-row{display:grid;grid-template-columns:minmax(160px,260px) 1fr 170px;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--soft)}
.rate-row:last-child{border-bottom:0}
.rate-row .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rate-row .num{text-align:right;font-variant-numeric:tabular-nums}
.rate-row .num b{font-size:18px}
.rate-row .num span{color:var(--muted);font-size:12px;display:block}
.track{position:relative;height:22px;background:var(--soft);border-radius:6px}
.track .fill{position:absolute;left:0;top:0;bottom:0;background:var(--ok);border-radius:6px;opacity:.85}
.track .ci{position:absolute;top:4px;bottom:4px;border-left:2px solid var(--ink);border-right:2px solid var(--ink)}
.track .ci:after{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid var(--ink)}
.verdict{margin-top:14px;padding:14px 16px;border-radius:10px;display:flex;gap:14px;align-items:center}
.verdict.sig{background:var(--ok-soft)} .verdict.nosig{background:var(--soft)} .verdict.worse{background:var(--bad-soft)}
.verdict .d{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;min-width:90px}
.verdict .t{color:var(--ink)} .verdict .t small{display:block;color:var(--muted)}
.seeds{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:8px 14px;align-items:center}
.seeds .lab{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cells{display:flex;flex-wrap:wrap;gap:3px}
.cell{width:16px;height:16px;border-radius:4px;background:var(--soft);cursor:default}
.cell.ok{background:var(--ok)} .cell.bad{background:var(--bad)} .cell.err{background:var(--warn)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.stack{display:flex;height:26px;border-radius:7px;overflow:hidden;background:var(--soft)}
.stack div{height:100%}
.fails-row{margin-bottom:14px}
.fails-row .lab{font-size:12.5px;color:var(--muted);margin-bottom:5px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:4px 12px;cursor:pointer;font-size:13px}
.tab.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.shot{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.shot img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#111}
.shot .cap{padding:7px 10px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px}
.tag{padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600}
.tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.ok{background:var(--ok-soft);color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--soft)}
th{color:var(--muted);font-weight:600;font-size:12px}
td.err{color:var(--bad);max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
pre.log{background:var(--dk-log);color:var(--dk-line);border-radius:10px;padding:14px;max-height:320px;overflow:auto;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;margin:0}
details summary{cursor:pointer;color:var(--muted);font-weight:600}
dialog{border:0;border-radius:16px;padding:0;width:min(640px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(20,20,20,.35)}
.form{padding:22px 24px}
.form h2{margin:0 0 14px;font-size:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
label{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:4px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel)}
textarea{resize:vertical;min-height:62px}
.field{margin-bottom:12px}
.seg{display:inline-flex;background:var(--soft);border-radius:9px;padding:3px;margin-bottom:14px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.hint{color:var(--muted);font-size:12.5px}
.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px;padding-top:14px;border-top:1px solid var(--soft)}
.estimate{font-variant-numeric:tabular-nums}
.error{color:var(--bad);font-size:13px;margin-top:8px}
nav.tabsnav{display:flex;gap:4px;margin-left:18px}
nav.tabsnav button{border:0;background:transparent;padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted)}
nav.tabsnav button.on{background:var(--soft);color:var(--ink)}
.view{flex:1;min-height:0;overflow:auto}
.hidden{display:none!important}
.pad{padding:24px 28px 60px;max-width:1280px}
.lead{color:var(--muted);margin:6px 0 0;max-width:820px}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px}
.cards3 .card{margin-top:0;display:flex;flex-direction:column}
.cards3 .card .grow{flex:1}
.cards3 h4{margin:0 0 4px;font-size:16px}
.cards3 p{margin:0 0 12px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ds{display:grid;grid-template-columns:1.3fr 1fr 1.6fr;gap:18px;align-items:start}
.ds h4{margin:0;font-size:16px}
.kv{color:var(--muted);font-size:13px;margin-top:4px}
.kv b{color:var(--ink)}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.step .lbl{min-width:86px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.run{background:var(--run);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.btn.sm{padding:5px 10px;font-size:13px}
code.model{background:var(--soft);padding:2px 6px;border-radius:5px;font-size:12.5px;word-break:break-all}
.rank{display:grid;grid-template-columns:34px 1fr 200px 110px 190px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--soft)}
.rank:last-child{border-bottom:0}
.rank .n{font-weight:700;color:var(--muted)}
.rank .p{font-weight:600}
.best{background:var(--ok-soft);color:var(--ok);font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:6px}
.tele{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.screen{background:#111;border-radius:12px;overflow:hidden;position:relative;aspect-ratio:640/540}
.screen img{width:100%;height:100%;object-fit:contain;display:block}
.screen .rec{position:absolute;top:12px;left:12px;background:var(--bad);color:var(--panel);font-weight:700;padding:3px 10px;border-radius:20px;font-size:13px}
.screen .ok{position:absolute;top:12px;right:12px;background:var(--ok);color:var(--panel);font-weight:700;padding:3px 10px;border-radius:20px;font-size:13px}
.screen .off{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#aaa;text-align:center;padding:30px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}
kbd{display:inline-block;min-width:24px;text-align:center;padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--panel);font:12px ui-monospace,Menlo,monospace}
.bigbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bigbtns .btn{padding:10px}
.btn.rec{background:var(--bad);color:var(--panel);border-color:var(--bad)}
.btn.save{background:var(--ok);color:var(--panel);border-color:var(--ok)}
.field.check{display:flex;align-items:center;gap:8px;font-weight:500;margin:6px 0}
.focusnote{font-size:12.5px;color:var(--muted);margin-top:8px}
/* --- Data tab --- */
.dsitem{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
.dsitem:hover{border-color:var(--dk-faint)}
.dsitem.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.dsitem .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dsitem .nm{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dsitem .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.stepcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-top:16px}
.stephead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.stephead .num{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--panel);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.stephead .num.off{background:var(--soft);color:var(--muted)}
.stephead h2{margin:0;font-size:17px}
.stephead .state{margin-left:auto;color:var(--muted);font-size:13px}
.stepcard.locked > :not(.stephead){opacity:.45;pointer-events:none;user-select:none}
.stepcard.locked .stephead h2{color:var(--muted)}
.taskrows{display:grid;grid-template-columns:auto 1fr 110px;gap:8px 12px;align-items:center;margin-bottom:12px}
.taskrows input[type=checkbox]{width:auto}
.taskrows .tn{font-weight:600}
.taskrows .tp{color:var(--muted);font-size:12.5px}
.bal{display:grid;grid-template-columns:140px 1fr 150px;gap:10px;align-items:center;margin:6px 0}
.bal .bar{height:16px;background:var(--soft);border-radius:5px;overflow:hidden;position:relative}
.bal .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ok);opacity:.85}
.bal .bar b{position:absolute;top:0;bottom:0;border-left:2px dashed var(--muted)}
.bal .bar i.goal{background:var(--run);opacity:.35}
.warn{background:var(--dk-warn-soft, var(--soft));color:var(--ink);border-left:3px solid var(--warn);padding:8px 12px;border-radius:6px;margin-top:8px;font-size:13px}
.big3{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:14px}
.big3 .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.big3 .l{color:var(--muted);font-size:12.5px}
tr.new td{background:var(--ok-soft);transition:background 2s}
td .play{border:0;background:var(--soft);border-radius:6px;cursor:pointer;padding:2px 8px}
.check{display:flex;align-items:center;gap:10px;margin:8px 0}
.vid{width:min(760px,94vw)}
.vid video{width:100%;display:block;background:#000}
.vid .bar2{display:flex;gap:6px;padding:10px 14px;align-items:center}
.cmp{display:grid;grid-template-columns:150px 1fr;gap:10px 16px;align-items:center;padding:10px 0;border-bottom:1px solid var(--soft)}
.cmp:last-child{border-bottom:0}
.lock{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header>
  <div class="brand">Data<span>Collect demonstrations, check them, fine-tune Dream-1 on them, prove it got better</span></div>
  <div class="spacer"></div>
  <button class="btn primary" id="newDs">New dataset</button>
</header>
<main>
  <aside id="dsList"></aside>
  <section class="detail" id="detail">
    <div class="empty"><h2>No dataset yet</h2>Press <b>New dataset</b>, pick tasks, and record. Episodes appear here as they are saved.</div>
  </section>
</main>

<dialog id="vidDlg" class="vid">
  <video id="vid" controls autoplay muted playsinline></video>
  <div class="bar2"><span id="vidTitle" class="hint" style="flex:1"></span>
    <button class="btn sm" data-role="overhead">Overhead</button><button class="btn sm" data-role="wrist_l">Left wrist</button>
    <button class="btn sm" data-role="wrist_r">Right wrist</button><button class="btn sm" id="vidClose">Close</button></div>
</dialog>

<template id="teleopTpl">
  <div class="tele" style="margin-top:6px">
    <div><div class="screen" id="screen"><img id="frame" alt=""><div class="off" id="screenOff"></div></div>
      <div class="focusnote">Keys work while this page has focus: click the picture once if nothing moves.</div></div>
    <div>
      <div class="field"><label>Task</label><select class="taskSel" id="tTask"></select></div>
      <div class="bigbtns"><button class="btn primary" id="tStart">Start session</button><button class="btn" id="tStop">Stop session</button></div>
      <div class="kv" id="tStatus" style="margin-top:12px">No session.</div>
      <div class="bigbtns" style="margin-top:10px">
        <button class="btn rec" id="tRec">● Record</button><button class="btn save" id="tSave">Save</button>
        <button class="btn" id="tDiscard">Discard</button><button class="btn" id="tReset">New scene</button>
        <button class="btn" id="tArm">Switch arm (Tab)</button><button class="btn" id="tGrip">Gripper (Space)</button>
      </div>
      <div class="kv" id="tMsg" style="margin-top:10px"></div>
      <div class="keys" style="margin-top:12px">
        <span><kbd>W</kbd><kbd>S</kbd></span><span>away from / toward the robot</span>
        <span><kbd>A</kbd><kbd>D</kbd></span><span>left / right (top camera)</span>
        <span><kbd>R</kbd><kbd>F</kbd></span><span>up / down</span>
        <span><kbd>Q</kbd><kbd>E</kbd></span><span>turn the gripper</span>
        <span><kbd>Space</kbd></span><span>open / close the gripper</span>
        <span><kbd>Enter</kbd></span><span>Record, then Save</span>
      </div>
    </div>
  </div>
</template>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = x => (x == null ? "–" : Math.round(x * 100) + "%");
const money = x => (x == null ? "–" : "$" + (x < 1 ? x.toFixed(3) : x.toFixed(2)));
const PER_EPISODE_USD = 60 / 2.4 / 2250 * 3; // a 60 s episode, one call per 2.4 s, $3 per robot-hour (2250 calls)
const MIN_PER_TASK = 20;
let tasks = [], list = [], sel = null, detail = null, source = "scripted", extraNames = [], chosen = new Set();
const sig = {};

async function api(path, body) {
  const res = await fetch(path, body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : {});
  const data = res.status === 204 ? null : await res.json().catch(() => null);
  if (!res.ok) throw new Error((data && (data.detail || data.error)) || res.statusText);
  return data;
}
const changed = (key, value) => { const s = JSON.stringify(value); if (sig[key] === s) return false; sig[key] = s; return true; };
// A job's log, read for people: no local paths up front; the full log goes under Details.
const unpath = t => String(t || "").replace(/(\/(Users|home|private|var|tmp)\/[^\s'"]+)/g, "…");
const lastLine = log => esc(unpath((log || "").trim().split("\n").slice(-1)[0] || ""));
function failure(log, fallback) {
  const lines = (log || "").trim().split("\n");
  const why = [...lines].reverse().find(l => /(Error|Exception|refused|failed)\b/.test(l) && !/^\s*File "/.test(l));
  const text = why ? unpath(why.replace(/^.*?(\w*(Error|Exception)):\s*/, "")).trim() : fallback;
  return `<span>${esc(text || fallback)}</span><details class="hint" style="margin-top:4px"><summary style="cursor:pointer">Details</summary>
    <pre class="log" style="margin-top:6px">${esc(lines.slice(-40).join("\n"))}</pre></details>`;
}
function when(t) {
  if (typeof t !== "number") return "";
  const d = new Date(t * 1000);
  return d.toLocaleDateString([], {month:"short", day:"numeric"}) + " " + d.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
}

// ---- dataset list -------------------------------------------------------------------------------------------
function renderList() {
  const names = new Set(list.map(d => d.name));
  const items = [...extraNames.filter(n => !names.has(n)).map(n => ({name: n, episodes: 0, minutes: 0, tasks: [], jobs: {}, fresh: true})), ...list];
  if (!changed("list", [items, sel])) return;
  if (!items.length) { $("#dsList").innerHTML = '<div class="hint" style="padding:8px">No datasets yet.</div>'; return; }
  $("#dsList").innerHTML = items.map(d => {
    const rec = d.jobs?.record?.running, ft = d.finetune?.stage;
    const pill = rec ? '<span class="pill running">recording</span>' : (ft ? `<span class="pill done">${esc(ft)}</span>` : (d.fresh ? '<span class="pill done">new</span>' : ""));
    return `<button class="dsitem ${d.name === sel ? "sel" : ""}" data-name="${esc(d.name)}">

$("#newDs").onclick = () => {

// ---- one dataset: the four steps ----------------------------------------------------------------------------
function stepHead(n, title, state, on = true) {

}

async function refreshDetail() {

// 1 · Collect
let formOpen = false;
function renderCollect(d) {

  if (changed("collectForm", [source, recording, tasks.length])) {
    const seg = [["scripted", "Scripted expert · free"], ["dream-1", "Dream-1 · uses credits"], ["teleop", "Teleop · you drive"]]
      .map(([k, l]) => `<button type="button" data-src="${k}" class="${source === k ? "on" : ""}">${l}</button>`).join("");
    const what = {scripted: "An IK expert that knows where everything is does the task. Only successful episodes are kept.",

          <div class="field"><label>Max sim s / episode</label><input id="cMax" type="number" min="10" value="60"></div>

let vidIndex = 0, reviewOpen = null;
function openVideo(i, role = "overhead") {

// 3 · Fine-tune
function renderTrain(d) {
  const j = d.jobs || {}, v = d.validate, f = d.finetune || {};
  if (!changed("train", [d.episodes, d.warnings, d.busy, j.validate, j.finetune, j.status, v, f])) return;
  const enough = d.episodes >= MIN_PER_TASK;
  const checking = j.validate?.running, training = j.finetune?.running;
  const checkLine = checking ? '<span class="dot run"></span> checking…' :
    (v ? (v.ok ? `<span class="dot ok"></span> ready: ${v.episodes} episodes, ${v.frames} frames at ${v.fps} fps` : `<span class="dot bad"></span> <span style="color:var(--bad)">${esc(v.error)}</span>`)
       : (j.validate?.status === "failed" ? `<span class="dot bad"></span> <span style="color:var(--bad)">${failure(j.validate.log, "the check did not finish")}</span>` : '<span class="dot"></span> not checked since the last change'));
  let ftLine = '<span class="dot"></span> not started';
  if (training) ftLine = `<span class="dot run"></span> ${esc(f.stage || "starting")}… <span class="hint">${lastLine(j.finetune.log)}</span>`;
  else if (f.stage) ftLine = `<span class="dot ${f.stage === "done" ? "ok" : (f.stage === "failed" ? "bad" : "run")}"></span> ${esc(f.stage)}${f.error ? ` <span style="color:var(--bad)">${esc(f.error)}</span>` : ""}${f.started ? ` <span class="hint">since ${when(f.started)}</span>` : ""}`;
  else if (j.finetune?.status === "failed") ftLine = `<span class="dot bad"></span> <span style="color:var(--bad)">${failure(j.finetune.log, "fine-tuning did not start")}</span>`;

  $("#train").innerHTML = `
    <div class="check"><span class="dot ${enough ? "ok" : ""}"></span> Enough data: ${d.episodes} episodes${d.warnings.length ? ` <span class="hint">(${d.warnings.length} warning${d.warnings.length > 1 ? "s" : ""} in Check)</span>` : ""}</div>
    <div class="check">${checkLine} <button class="btn sm" id="tCheck" ${d.episodes && !d.busy && !checking ? "" : "disabled"}>Check format</button></div>
    <div class="check">${ftLine}
      <button class="btn sm primary" id="tTrain" ${v?.ok && !d.busy && !training && !f.job_id ? "" : "disabled"}>Upload &amp; fine-tune</button>
      ${f.stage === "training" ? '<button class="btn sm" id="tJob">Check job</button>' : ""}</div>
    ${f.model ? `<div class="check"><span class="dot ok"></span> Model <code class="model">${esc(f.model)}</code></div>` : ""}

  $("#tCheck").onclick = () => act("validate");

  const job = $("#tJob"); if (job) job.onclick = () => act("status");
}

// 4 · Compare
function verdict(p) {
  const sig = p.p_value < 0.05, dd = p.delta;
  const text = sig ? (dd > 0 ? "the fine-tune is better, and it is not luck" : "the fine-tune is worse, and it is not luck") : "no proven difference yet: could be luck";
  return `<b>${dd > 0 ? "+" : ""}${Math.round(dd * 100)} pp</b> · ${text} <span class="hint">(McNemar p = ${p.p_value}, ${p.seeds} identical scenes)</span>`;
}
function renderEvaluate(d) {

  $("#state4").textContent = running ? "running…" : (ev ? "done" : "");
  let html = `<div class="hint" style="margin-bottom:10px">Base Dream-1 and the fine-tune on the same scenes, every task of this dataset. A difference counts only when McNemar says it is not luck.</div>
    <div class="grid2"><div class="field"><label>Fine-tuned model</label><input id="eModel" value="${esc(model)}" placeholder="appears after training; or paste a model id"></div>
      <div class="field"><label>Scenes per task</label><input id="eN" type="number" min="5" max="200" value="${ev?.n || 20}"></div></div>
    <div class="actions"><span class="hint" id="eEst"></span><button class="btn primary" id="eGo" ${running ? "disabled" : ""}>Compare base vs fine-tune</button></div>`;
  if (ev?.results?.length) {
    html += `<div style="margin-top:14px">${ev.results.map(r => {
      const run = r.run;
      if (!run) return `<div class="cmp"><b>${esc(r.task)}</b><span class="hint">run not found</span></div>`;
      const [a, b] = run.summaries;
      const p = (run.paired || [])[0];
      const prog = run.status === "running" ? ` <span class="hint">${run.done}/${run.total} episodes…</span>` : "";
      const link = (run.dreamkit_runs || []).filter(x => x.id).map(x => `<a href="/#/history/${encodeURIComponent(x.id)}" target="_top">${esc(x.label)}</a>`).join(" · ");
      return `<div class="cmp"><div><b>${esc(r.task)}</b>${prog}</div><div>
        base <b>${pct(a?.success_rate)}</b> <span class="hint">${a?.successes ?? 0}/${a?.episodes ?? 0}</span> → fine-tune <b>${pct(b?.success_rate)}</b> <span class="hint">${b?.successes ?? 0}/${b?.episodes ?? 0}</span>
        ${p && p.seeds ? `<div>${verdict(p)}</div>` : ""}${link ? `<div class="hint">In History: ${link}</div>` : ""}</div></div>`;
    }).join("")}</div>`;
  }
  $("#evaluate").innerHTML = html;
  const est = () => { const n = +$("#eN").value || 0; $("#eEst").textContent = `${2 * n * nTasks} episodes · up to ~${money(2 * n * nTasks * PER_EPISODE_USD)}`; };
  $("#eN").oninput = est; est();
  $("#eGo").onclick = async () => {
    $("#evalErr").textContent = "";

    if (!confirm(`Run base Dream-1 and ${m} on ${n} scenes for each of ${nTasks} task(s): ${2 * n * nTasks} episodes, up to ~${money(2 * n * nTasks * PER_EPISODE_USD)}. Start?`)) return;
    try { await api(`api/dataset/${encodeURIComponent(sel)}/evaluate`, {model: m, n}); refreshDetail(); }
    catch (e) { $("#evalErr").textContent = e.message; }
  };
}

// ---- teleop (a source in Collect) ----------------------------------------------------------------------------
let tState = {status: "off"}, keysDown = new Set(), lastKeys = "", framePending = false;
const TELE_KEYS = new Set(["KeyW","KeyA","KeyS","KeyD","KeyR","KeyF","KeyQ","KeyE","ArrowUp","ArrowDown","ArrowLeft","ArrowRight","ShiftLeft","ShiftRight","PageUp","PageDown"]);
const teleVisible = () => source === "teleop" && !!$("#screen");
const teleActive = () => teleVisible() && tState.status === "running" && !["INPUT","SELECT","TEXTAREA"].includes(document.activeElement?.tagName);
const tcmd = c => api("api/teleop/cmd", {cmd: c}).catch(e => { if ($("#tMsg")) $("#tMsg").textContent = e.message; });
window.addEventListener("keydown", e => {
  if (!teleActive()) return;
  if (TELE_KEYS.has(e.code)) { keysDown.add(e.code); e.preventDefault(); }
  else if (e.code === "Space") { e.preventDefault(); if (!e.repeat) tcmd("grip"); }
  else if (e.code === "Tab") { e.preventDefault(); tcmd("arm"); }
  else if (e.code === "Enter") { e.preventDefault(); tcmd(tState.recording ? "save" : "record"); }
});
window.addEventListener("keyup", e => { keysDown.delete(e.code); });
window.addEventListener("blur", () => keysDown.clear());
setInterval(() => {
  if (tState.status !== "running") return;
  const k = [...keysDown].sort().join(",");
  if (k !== lastKeys || k) { lastKeys = k; api("api/teleop/keys", {keys: [...keysDown]}).catch(() => {}); }
}, 100);
function pullFrame() {
  if (!teleVisible() || tState.status !== "running") { framePending = false; return; }
  framePending = true;
  const img = $("#frame");
  img.onload = img.onerror = () => setTimeout(pullFrame, 70);
  img.src = "api/teleop/frame?t=" + Date.now();
}
function renderTeleop() {
  if (!$("#screen")) return;
  const s = tState, here = s.dataset && s.dataset.split("/").slice(-1)[0] === sel;
  const on = s.status === "running" && here;
  $("#screenOff").classList.toggle("hidden", on);
  $("#screenOff").innerHTML = s.status === "error" ? `<div><b style="color:var(--dk-bad-soft)">Teleop stopped</b><br>${esc(s.error)}</div>` :
    (s.status === "starting" ? "Loading the simulator…" :
     (s.status === "running" && !here ? `A teleop session is recording into <b>${esc(s.dataset.split("/").slice(-1)[0])}</b>. Stop it or start one here.` :
      "Pick a task and press Start session.<br>The first start loads the simulator (a few seconds)."));
  $("#screen").querySelectorAll(".rec,.ok").forEach(b => b.remove());
  if (on && s.recording) $("#screen").insertAdjacentHTML("beforeend", `<div class="rec">● REC ${s.record_seconds}s · ${s.frames} frames</div>`);
  if (on && s.success) $("#screen").insertAdjacentHTML("beforeend", `<div class="ok">✓ task done</div>`);
  $("#tStatus").innerHTML = on ? `Arm <b>${esc(s.arm)}</b> · gripper <b>${esc(s.gripper)}</b> · ${s.placed ? "<b style='color:var(--ok)'>object in place</b>" : "object not in place"} · <b>${s.episodes}</b> episodes in the dataset`
    : (s.status === "starting" ? "Starting…" : "No session.");
  $("#tMsg").textContent = on ? (s.message || "") : "";
  ["#tRec","#tSave","#tDiscard","#tReset","#tArm","#tGrip"].forEach(id => $(id).disabled = !on);
  $("#tStop").disabled = s.status !== "running";
  if (on) { $("#tRec").disabled = s.recording; $("#tSave").disabled = $("#tDiscard").disabled = !s.recording; }
  if (on && !framePending) pullFrame();
}
async function pollTeleop() {
  if (!teleVisible()) return;
  try { tState = await api("api/teleop/state"); } catch (e) { tState = {status: "off"}; }
  renderTeleop();
}
function bindTeleop() {
  $("#tStart").onclick = async () => {
    try { await api("api/teleop/start", {task: $("#tTask").value, dataset: sel}); tState = {status: "starting", dataset: sel}; renderTeleop(); }
    catch (e) { $("#tMsg").textContent = e.message; }
  };
  $("#tStop").onclick = () => api("api/teleop/stop", {}).then(pollTeleop);
  $("#tRec").onclick = () => tcmd("record");
  $("#tSave").onclick = () => tcmd("save");
  $("#tDiscard").onclick = () => tcmd("discard");
  $("#tReset").onclick = () => tcmd("reset");
  $("#tArm").onclick = () => tcmd("arm");
  $("#tGrip").onclick = () => tcmd("grip");
  $("#screen").onclick = () => document.activeElement?.blur();
  framePending = false;
}
function fillTaskSelects() {
  const opts = tasks.map(t => `<option value="${esc(t.name)}">${esc(t.name)} — ${esc(t.prompt)}</option>`).join("");
  document.querySelectorAll(".taskSel").forEach(s => s.innerHTML = opts);
}

(async () => {
  tasks = await api("api/tasks");
  await refreshList();
  if (list.length) select(list[0].name);
  const visible = () => !document.hidden;
  const busy = () => detail && (detail.recording || detail.jobs?.validate?.running || detail.jobs?.finetune?.running ||
    detail.evaluate?.results?.some(r => r.run?.status === "running"));
  let last = 0;
  setInterval(() => {
    if (!visible() || !sel) return;
    if (busy() || Date.now() - last > 6000) { last = Date.now(); refreshDetail(); }
  }, 2000);
  setInterval(() => { if (visible()) refreshList(); }, 4000);
  setInterval(() => { if (visible() && teleVisible()) pollTeleop(); }, 300);
})();
</script>

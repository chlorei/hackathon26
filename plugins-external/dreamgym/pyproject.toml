[project]
name = "dreamkit-dreamgym"
version = "0.2.0"
description = "DreamGym: the Data tab of dreamkit — collect, review and fine-tune on demonstrations, compare base vs fine-tune"
requires-python = ">=3.11"
dependencies = ["dreamkit>=0.2,<0.4", "numpy", "pillow>=10", "fastapi>=0.110"]

[project.entry-points."dreamkit.apps"]
dreamgym = "dreamgym.app:app"

[project.scripts]
dreamgym = "dreamgym.cli:main"

[tool.dreamkit]
kind = "app"
title = "Data"
icon = "Database"
needs = ["robot", "world"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dreamgym"]
artifacts = ["dreamgym/web/page/index.html"]

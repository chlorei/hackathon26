[project]
name = "dreamkit-gripper-check"
version = "0.2.0"
description = "gripper-check: a dreamkit plugin"
requires-python = ">=3.11"
dependencies = ["dreamkit>=0.2,<0.4"]

[project.entry-points."dreamkit.plugins"]
gripper-check = "gripper_check:GripperCheck"

[tool.dreamkit]
api = "1"
group = "diagnosis"
icon = "Hand"
capability = "observe"
hooks = ["on_episode_start", "on_step", "on_episode_end"]
step_rate_hz = 10
needs_frames = false
requires = []
conflicts = []
ui = "ui/index.html"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gripper_check"]

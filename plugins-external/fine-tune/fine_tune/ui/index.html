<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>fine-tune</title></head>
<body>
<!-- PLUGIN_STANDARD §7a: the server links the theme and puts this plugin's record in window.DK_PLUGIN;
     dk.plugin (/theme/dreamkit-page.js) draws the standard page: what it is, what it did in this run, its settings -->
<script src="/theme/dreamkit-page.js"></script>
<script>
// fine-tune: the dataset it built from successful attempts, and the training job it started.
const STAGES = { uploading: 'uploading', processing: 'processing', processed: 'processed', training: 'training', done: 'ready', failed: 'failed' }
dk.plugin({
  how: (P) => [
    dk.h('p', {}, `At the end of the run it gathers successful attempts from harvester${P.include_previous_runs ? ' (this run and earlier ones' : ' (this run only'}${P.same_task_only ? ', same task)' : ', any task)'} into one dataset and checks it with Dream Labs' validate_dataset.`),
    dk.h('p', {}, P.auto_train ? `With ${P.min_episodes} or more it uploads them and starts a Dream-1 fine-tune named …-${P.suffix} (uses fine-tuning credits).` : `With ${P.min_episodes} or more it is ready to train; auto_train is off, so nothing is uploaded until you switch it on.`),
  ],
  numbers: async (c) => {
    c.status = await dk.json('fine-tune/status.json'); c.job = await dk.json('fine-tune/job.json')
    const st = c.status, need = (st && st.min_episodes) || c.P.min_episodes, v = (st && st.validate) || {}
    return st ? [
      { label: 'successful attempts', value: `${st.episodes} of ${need}`, sub: st.episodes >= need ? 'enough to train' : `${need - st.episodes} more to train`, tone: st.episodes >= need ? 'ok' : null },
      { label: 'validate_dataset', value: v.ok ? 'ok' : st.episodes ? 'fails' : '–', sub: v.ok ? `${dk.fmt(st.duration_s / 60)} min, ${st.frames} frames` : v.error || null, tone: v.ok ? 'ok' : st.episodes ? 'bad' : null },
      { label: 'training', value: c.job && c.job.stage ? STAGES[c.job.stage] || c.job.stage : 'not started', tone: c.job && c.job.stage === 'done' ? 'ok' : c.job && c.job.stage === 'failed' ? 'bad' : null },
    ] : []
  },
  quiet: () => 'It works at the end of the run: nothing yet.',
  download: false,  // the Data card below has it
  extra: (c) => {
    if (!c.status) return dk.card('Dataset', dk.empty('Nothing yet: the dataset is built when the run ends.'))
    const j = c.job || {}, rows = [['dataset', j.dataset_name], ['dataset id', j.dataset_id], ['attempts uploaded', j.episodes], ['job', j.job_id], ['model', j.model], ['error', j.error]].filter(([, v]) => v != null && v !== '')
    const next = j.model ? `Compare it with the base model: python examples/ab_test.py --models dreamlabs/dream-1-beta,${j.model} --episodes 20`
      : j.stage === 'training' || j.stage === 'processing' ? 'Training takes hours; each new run asks Dream Labs about it and the model id appears here.'
      : (c.status.validate || {}).ok && c.status.episodes >= c.status.min_episodes && !c.status.auto_train ? 'Ready: switch on auto_train (Change settings) and run once more to upload and train.'
      : 'Collecting: keep harvester and success-check on and run more attempts.'
    return [
      dk.card('Training job', rows.length ? dk.h('dl', { class: 'dk-settings' }, rows.map(([k, v]) => [dk.h('dt', {}, k), dk.h('dd', {}, String(v))])) : dk.empty('No job yet.'), dk.h('p', { class: 'dk-faint' }, next)),
      dk.card('Where the data comes from', (c.status.sources || []).length
        ? dk.h('details', {}, dk.h('summary', {}, `${dk.plural(c.status.sources.length, 'run')}${c.status.sources.includes(dk.RUN) ? ', this one included' : ''}`),
          dk.h('ul', { class: 'dk-how' }, c.status.sources.map((r) => dk.h('li', {}, r, r === dk.RUN ? ' (this run)' : ''))))
        : dk.empty('No successful attempts found.'),
        dk.row(dk.downloadButton('fine-tune', () => ({ status: c.status, job: c.job })))),
    ]
  },
})
</script>
</body>
</html>

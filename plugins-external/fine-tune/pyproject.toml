[project]
name = "dreamkit-fine-tune"
version = "0.1.0"
description = "fine-tune: successful attempts -> a checked dataset -> a Dream-1 fine-tune"
requires-python = ">=3.11"
dependencies = ["dreamkit>=0.3,<0.4"]

[project.entry-points."dreamkit.plugins"]
fine-tune = "fine_tune:FineTune"

[tool.dreamkit]
api = "1"
group = "output"
icon = "GraduationCap"
capability = "observe"
hooks = ["on_run_start", "on_run_end"]
step_rate_hz = 1
needs_frames = false
requires = ["harvester"]
conflicts = []
ui = "ui/index.html"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fine_tune"]

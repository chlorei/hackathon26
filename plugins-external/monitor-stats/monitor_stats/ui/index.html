<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>monitor-stats</title></head>
<body>
<!-- PLUGIN_STANDARD §7a: the server links the theme and puts this plugin's record in window.DK_PLUGIN;
     dk.plugin (/theme/dreamkit-page.js) draws the standard page: what it is, what it did in this run, its settings -->
<script src="/theme/dreamkit-page.js"></script>
<script>
// monitor-stats: what the camera judge saw in each try (its frames and verdicts), and how often it agreed.
const judged = (r) => typeof r.success === 'boolean'
const isFinal = (r) => r.final !== false
dk.plugin({
  how: (P) => [
    dk.h('p', {}, `At the end of each attempt, and of every try a recovery cut short, it sends ${P.frames} frames of the ${P.camera} camera (at most ${P.image_width} px wide) and the task to a vision model (${P.provider === 'gemini' ? 'Gemini Flash-Lite, then Flash' : 'Claude'}), which says success or not, a score, the reason, and a comment on every frame.`),
    dk.h('p', {}, `It waits at most ${P.timeout_s} s for a model call and ${P.max_wait_s} s for a verdict; the robot never waits for it. It also tells how often the camera agrees with success-check.`),
  ],
  numbers: async (c) => {
    c.rows = (await dk.json('monitor-stats/attempts.json')) || []
    const finals = c.rows.filter(isFinal), j = finals.filter(judged), ok = j.filter((r) => r.success).length
    const both = j.filter((r) => typeof r.check === 'boolean'), agree = both.filter((r) => r.check === r.success).length
    const caught = c.rows.filter((r) => !isFinal(r) && judged(r) && !r.success).length
    return [
      { label: 'attempts judged', value: `${j.length} of ${c.episodes.length}`, sub: `${ok} success by the camera`, tone: j.length < finals.length ? 'warn' : null },
      { label: 'agrees with success-check', value: both.length ? `${agree} of ${both.length}` : '–', tone: both.length && agree < both.length ? 'warn' : both.length ? 'ok' : null },
      { label: 'failed tries caught', value: String(caught), sub: 'before a recovery took over' },
    ]
  },
  item: (e) => ({ t: e.data && e.data.at_s != null ? e.data.at_s : e.t_s, level: e.level, text: e.message }),
  context: (c, ep) => {
    const rows = (c.rows || []).filter((r) => r.episode === ep.episode)
    return rows.map((r) => dk.h('div', { class: 'dk-try' },
      dk.h('p', { class: 'dk-row' }, rows.length > 1 ? dk.h('b', {}, `try ${r.try}`) : null,
        !judged(r) ? dk.h('span', { class: 'dk-pill warn' }, 'not judged') : dk.h('span', { class: `dk-pill ${r.success ? 'ok' : 'bad'}` }, r.success ? 'success' : 'failed'),
        judged(r) ? dk.h('span', { class: 'dk-faint' }, `score ${r.score}${r.model_s != null ? ` · answered in ${dk.fmt(r.model_s)} s` : ''}`) : null,
        judged(r) && typeof r.check === 'boolean' ? dk.h('span', { class: r.check === r.success ? 'dk-faint' : 'dk-warn' }, r.check === r.success ? 'agrees with success-check' : `success-check says ${r.check ? 'success' : 'failed'}`) : null),
      r.reason || r.error ? dk.h('p', { class: 'dk-faint' }, r.reason || r.error) : null,
      dk.h('div', { class: 'dk-frames' }, (r.frames || []).map((f, i) => dk.h('figure', { class: f.status === 'error' ? 'bad' : '' },
        f.file ? dk.h('img', { src: dk.media(`monitor-stats/${f.file}`), alt: `frame ${i + 1}`, loading: 'lazy' }) : null,
        dk.h('figcaption', {}, `${f.t_s != null ? dk.fmt(f.t_s) + ' s' : ''}${f.comment ? ' · ' + f.comment : ''}`))))))
  },
  download: false,  // its Data card below has JSON and CSV
  extra: (c) => {
    const rows = c.rows || []
    if (!rows.some(judged)) return null
    const counts = {}
    for (const r of rows) if (judged(r) && !r.success) { const k = r.reason_label || r.reason_code || 'other'; counts[k] = (counts[k] || 0) + 1 }
    const n = Math.max(0, ...rows.map((r) => (r.frames || []).length))
    const bins = Array.from({ length: n }, (_, i) => ({ label: `${i + 1}`, value: 0, tone: 'bad', title: '' }))
    for (const r of rows) {
      if (!judged(r) || r.success) continue
      const i = (r.frames || []).findIndex((f) => f.status === 'error')
      if (i >= 0) bins[i].value++
    }
    const csv = () => {
      const cell = (v) => { const t = v == null ? '' : String(v); return /[",\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t }
      const lines = rows.map((r) => [r.episode, r.try ?? 1, r.task, judged(r) ? r.success : '', r.score, r.reason_code, r.reason, r.check,
        ((r.frames || []).find((f) => f.status === 'error') || {}).t_s, r.model_s, r.error].map(cell).join(','))
      const url = URL.createObjectURL(new Blob([['episode,try,task,judge_success,score,reason_code,reason,success_check,first_error_s,model_s,error', ...lines].join('\n') + '\n'], { type: 'text/csv' }))
      const a = dk.h('a', { href: url, download: `monitor-stats_${dk.RUN}.csv` }); document.body.append(a); a.click(); a.remove()
    }
    return [
      dk.card('Score of each try', dk.bars(rows.filter(judged).map((r) => ({ label: rows.filter((x) => x.episode === r.episode).length > 1 ? `${r.episode}.${r.try}` : `${r.episode}`, value: r.score, tone: r.success ? 'ok' : 'bad', title: `attempt ${r.episode}, try ${r.try ?? 1}: score ${r.score}` })), { max: 100 })),
      Object.keys(counts).length ? dk.card('Why the camera says it failed', dk.hbars(Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([label, value]) => ({ label, value, tone: 'bad' })))) : null,
      bins.some((b) => b.value) ? dk.card('First flagged frame of a failed try', dk.bars(bins), dk.h('p', { class: 'dk-faint' }, 'frames are spread evenly over the try: 1 is its start')) : null,
      dk.card('Data', dk.row(dk.downloadButton('monitor-stats', () => rows), dk.h('button', { class: 'dk-btn', on: { click: csv } }, 'Download CSV'))),
    ]
  },
})
</script>
</body>
</html>

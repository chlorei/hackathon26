<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>camera-check</title></head>
<body>
<!-- PLUGIN_STANDARD §7a: the server links the theme and puts this plugin's record in window.DK_PLUGIN;
     dk.plugin (/theme/dreamkit-page.js) draws the standard page: what it is, what it did in this run, its settings -->
<script src="/theme/dreamkit-page.js"></script>
<script>
// camera-check: how many pictures it looked at, and the ones that were black, uniform or frozen.
dk.plugin({
  how: (P) => [
    dk.h('p', {}, `Before every model call it looks at each camera's picture: darker than ${P.min_mean} on average is black, less contrast than ${P.min_std} is uniform${P.frozen_calls ? `, the same picture across ${P.frozen_calls} calls while the arms moved (more than ${P.moved_rad} rad) is frozen` : ''}.`),
    dk.h('p', {}, 'A dead camera makes the model act blind, so it calls a camera failure at once; recovery stops the robot.'),
  ],
  numbers: async (c) => {
    c.files = await Promise.all(c.episodes.map((e) => dk.json(`camera-check/ep${dk.ep3(e.episode)}_checks.json`)))
    const pics = c.files.reduce((a, f) => a + (f ? Object.values(f.cameras || {}).reduce((x, d) => x + d.checks, 0) : 0), 0)
    const bad = c.episodes.filter((e) => (e.verdicts || []).some((v) => v.by === 'camera-check')).length
    const cams = new Set(c.files.flatMap((f) => (f ? Object.keys(f.cameras || {}) : [])))
    return [
      { label: 'pictures checked', value: String(pics), sub: cams.size ? `from ${[...cams].join(', ')}` : 'no record for this run' },
      { label: 'camera failures', value: String(bad), tone: bad ? 'bad' : 'ok', sub: bad ? 'black, uniform or frozen' : 'every picture looked alive' },
    ]
  },
  context: (c, ep) => {
    const f = c.files && c.files[c.episodes.indexOf(ep)]
    const shots = Object.entries((f && f.frames) || {})
    if (!f || (!shots.length && !(f.problems || []).length)) return null  // a fine attempt: nothing to say
    const cams = Object.entries(f.cameras || {})
    return [dk.h('p', { class: 'dk-faint' }, `Checked ${cams.map(([cam, d]) => `${d.checks} from ${cam}`).join(', ')}.`),
      shots.length ? dk.h('div', { class: 'dk-frames' }, shots.map(([cam, file]) => dk.h('figure', { class: 'bad' },
        dk.h('img', { src: dk.media(`camera-check/${file}`), alt: `${cam} camera picture that failed` }),
        dk.h('figcaption', {}, (f.problems || []).find((p) => p.includes(`camera ${cam} `)) || cam)))) : null]
  },
  quiet: (c) => {
    const pics = (c.files || []).reduce((a, f) => a + (f ? Object.values(f.cameras || {}).reduce((x, d) => x + d.checks, 0) : 0), 0)
    return `Nothing to report: every picture looked alive in all ${c.episodes.length} attempts (${pics} checked).`
  },
})
</script>
</body>
</html>

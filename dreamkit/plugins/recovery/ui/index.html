<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>recovery</title></head>
<body>
<!-- PLUGIN_STANDARD §7a: the server links the theme and puts this plugin's record in window.DK_PLUGIN;
     dk.plugin (/theme/dreamkit-page.js) draws the standard page: what it is, what it did in this run, its settings -->
<script src="/theme/dreamkit-page.js"></script>
<script>
// recovery: where it stepped in, what it did, and how the attempt ended.
dk.plugin({
  how: (P) => [
    dk.h('p', {}, `When failure-monitor names ${P.reasons.map((r) => r.replace(/_/g, ' ')).join(', ')}, it takes over from where the robot is: arms home in ${P.home_s} s and the model asked again; for grasped air it opens the hand and lifts it ${Math.round(P.lift_m * 100)} cm first. At most ${P.max_recoveries} times per attempt.`),
    dk.h('p', {}, `It stops the robot at once on ${P.stop_on.map((r) => r.replace(/_/g, ' ')).join(', ')}${P.retry_attempts ? `, and retries a failed scene ${P.retry_attempts}× once its recoveries are used up` : ''}.`),
  ],
  numbers: (c) => {
    const helped = c.episodes.filter((e) => e.recovery && e.recovery.count)
    const saved = helped.filter((e) => e.success)
    return [
      { label: 'attempts saved', value: `${saved.length} of ${helped.length}`, sub: helped.length ? 'it stepped in, and then it worked' : 'it never had to step in', tone: saved.length ? 'ok' : null },
      { label: 'recoveries used', value: String(helped.reduce((a, e) => a + e.recovery.count, 0)) },
    ]
  },
})
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>failure-monitor</title></head>
<body>
<!-- PLUGIN_STANDARD §7a: the server links the theme and puts this plugin's record in window.DK_PLUGIN;
     dk.plugin (/theme/dreamkit-page.js) draws the standard page: what it is, what it did in this run, its settings -->
<script src="/theme/dreamkit-page.js"></script>
<script>
// failure-monitor: the moments it saw, and the failures it named (with their second).
const cm = (m) => `${Math.round(m * 100)} cm`
dk.plugin({
  how: (P) => [
    dk.h('p', {}, `It follows each attempt step by step: a hand within ${cm(P.reach_m)} of the object has reached it, a gripper closing within ${cm(P.near_m)} grasps it, an object raised ${cm(P.lift_m)} is lifted.`),
    dk.h('p', {}, `It names the first thing that went wrong: dropped (a lifted object ${cm(P.slip_m)} from every hand), grasped air, stalled (every joint under ${P.stall_speed_rad_s} rad/s for ${P.stall_s} s), not reached after ${P.not_reached_s} s, a collision over ${P.contact_force_n} N, a model slower than ${P.slow_ms} ms.${P.live_verdicts ? ' It calls it mid-attempt, so recovery can act.' : ''}`),
  ],
  numbers: (c) => {
    const v = c.episodes.flatMap((e) => (e.verdicts || []).filter((x) => x.by === 'failure-monitor'))
    const count = {}
    for (const x of v) count[x.reason] = (count[x.reason] || 0) + 1
    const top = Object.entries(count).sort((a, b) => b[1] - a[1])[0]
    return [
      { label: 'failures it named', value: String(v.length), tone: v.length ? 'bad' : 'ok', sub: v.length ? `in ${new Set(c.episodes.filter((e) => (e.verdicts || []).some((x) => x.by === 'failure-monitor')).map((e) => e.episode)).size} of ${c.episodes.length} attempts` : 'every attempt went to plan' },
      { label: 'most common', value: top ? top[0].replace(/_/g, ' ') : '–', sub: top ? `${top[1]}×` : null },
    ]
  },
})
</script>
</body>
</html>
